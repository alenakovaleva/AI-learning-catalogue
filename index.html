<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI learning catalogue</title>
<script>try{if(localStorage.getItem("catalogue-theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --ink:#0A0C0E; --muted:#5B6270; --line:#E0E4EB;
  --accent:#1BEDBA; --accent-ink:#0A0C0E; --accent-text:#08876A; --accent-soft:#D4FAF0; --bar:#C6F6E8;
  --paid:#0000C8; --paid-soft:#E7E7FD; --mark:#A8F5E2; --check:#0A0C0E;
  --link:#3062F6; --link-text:#2350DC; --link-soft:#EBF0FF; --link-ink:#FFFFFF;
  --band:#FFFFFF; --band-ink:#0A0C0E; --band-muted:#5B6270; --band-line:#E0E4EB; --search-bg:#F4F6F9;
  --radius:10px;
  --font:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#0A0C0E; --surface:#15181D; --ink:#F2F4F7; --muted:#9BA3B0; --line:#262B33;
  --accent:#1BEDBA; --accent-ink:#0A0C0E; --accent-text:#1BEDBA; --accent-soft:#0F3A31; --bar:#123A31;
  --paid:#A9A9FF; --paid-soft:#1D1D4D; --mark:#0F5A49; --check:#1BEDBA;
  --link:#6F93FF; --link-text:#9DB6FF; --link-soft:#16224D; --link-ink:#0A0C0E;
  --band:#000000; --band-ink:#FFFFFF; --band-muted:#9BA3B0; --band-line:#262B33; --search-bg:#15181D;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}

/* Header */
.band{background:var(--band);color:var(--band-ink);margin-bottom:28px;border-bottom:1px solid var(--band-line)}
:root{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
.band-bar{display:flex;align-items:center;gap:14px;min-height:64px;border-bottom:1px solid var(--band-line)}
.logo{height:28px;width:auto;display:block;color:var(--band-ink);flex:none}
.theme-btn{margin-left:auto;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--band-line);border-radius:8px;background:none;color:var(--band-ink);cursor:pointer;font-size:14px}
.theme-btn:hover{border-color:var(--band-ink)}
.theme-btn .sun{display:none}
:root[data-theme="dark"] .theme-btn .sun{display:block}
:root[data-theme="dark"] .theme-btn .moon{display:none}
header.top{padding:36px 0 32px}
header.top h1{font-size:34px;line-height:1.12;font-weight:700;letter-spacing:-.015em;margin:0 0 8px}
header.top h1::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--accent);margin-bottom:16px}
header.top p{margin:0 0 22px;color:var(--band-muted);max-width:62ch}
.search{position:relative;max-width:760px}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;height:52px;padding:0 16px 0 46px;border:1px solid var(--line);border-radius:12px;background:var(--search-bg);color:var(--ink);font-size:16px}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(27,237,186,.35)}
.search kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);font:12px var(--font);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 7px}
.search input:not(:placeholder-shown) ~ kbd{display:none}

/* Layout */
.layout{display:grid;grid-template-columns:264px minmax(0,1fr);gap:36px;align-items:start;padding-bottom:48px}
aside.filters{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;padding-right:4px}
.facet{margin-bottom:26px}
.facet h2{font-size:14px;font-weight:600;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.facet h2 button{border:0;background:none;color:var(--accent-text);font-size:13px;cursor:pointer;padding:0}
.opt{display:flex;align-items:center;gap:9px;padding:5px 8px;margin:0 0 3px;border-radius:7px;cursor:pointer;font-size:14px;
  background:linear-gradient(to right,var(--bar) var(--w,0%),transparent var(--w,0%))}
.opt:hover{outline:1px solid var(--line)}
.opt input{accent-color:var(--check);margin:0;width:15px;height:15px;flex:none}
.opt span{flex:1;min-width:0}
.opt em{font-style:normal;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.opt.zero{opacity:.45}
.facet-note{font-size:12px;color:var(--muted);margin:6px 0 0}
.dept-row{display:flex;align-items:stretch;gap:2px;margin:0 0 3px}
.dept-row .opt{flex:1;min-width:0;margin:0}
.disc{flex:none;width:30px;border:0;background:none;border-radius:7px;cursor:pointer;color:var(--muted);display:grid;place-items:center;padding:0}
.disc:hover{outline:1px solid var(--line)}
.disc:focus-visible,.more-tasks:focus-visible{outline:2px solid var(--accent-text);outline-offset:1px}
.disc svg{width:12px;height:12px;transition:transform .15s}
.disc[aria-expanded="true"] svg{transform:rotate(90deg)}
.disc .sel{font-size:11px;font-weight:600;color:var(--accent-text)}
.tasks{margin:0 0 8px 16px;padding-left:8px;border-left:1px solid var(--line)}
.opt.sub{font-size:13px;padding:3px 8px;margin:0 0 2px}
.opt.sub em{font-size:12px}
.more-tasks{border:0;background:none;color:var(--accent-text);font-size:12.5px;cursor:pointer;padding:3px 8px;border-radius:6px}

/* Toolbar */
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .count{font-weight:600;margin-right:auto}
.toolbar select{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;height:34px;padding:0 12px;display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#filtersBtn{display:none;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 12px;cursor:pointer}
.active{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.active:empty{display:none}
.active button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 12px;font-size:13px;cursor:pointer}
.active button::after{content:"×";margin-left:6px;color:var(--muted)}
.active button.clear{border-color:transparent;background:none;color:var(--accent-text)}
.active button.clear::after{content:none}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.tile{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 14px}
.tile:hover{border-color:var(--ink)}
.tile-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.badge.free{background:var(--accent-soft);color:var(--accent-text)}
.badge.paid{background:var(--paid-soft);color:var(--paid)}
.tile h3{font-size:17px;line-height:1.3;margin:0 0 6px;font-weight:600}
.tile h3 button,.row-title{all:unset;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile h3 button::after{content:"";position:absolute;inset:0;border-radius:var(--radius)}
.tile h3 button:focus-visible::after{outline:2px solid var(--accent-text);outline-offset:2px}
.src{font-size:13px;color:var(--muted);margin:-2px 0 6px}
.desc{font-size:14px;color:var(--muted);margin:0 0 12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chips{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-wrap:wrap;gap:5px}
.chips li{font-size:12px;background:var(--bg);border-radius:999px;padding:2px 9px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips li.more{background:none;color:var(--muted);padding-left:2px}
.tgroup{margin:0 0 14px}
.tgroup+.tgroup{padding-top:12px;border-top:1px dashed var(--line)}
.tgroup .cap{margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tgroup .ttags,.tgroup .chips{margin:0}
.ttags{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-wrap:wrap;gap:5px}
.ttags li{font-size:12px;border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttags li.hit{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:500}
.ttags li.more{border:0;padding-left:2px}
.chips li.linked{padding:0;overflow:visible;background:var(--link-soft);border:1px solid var(--link)}
.chips li.linked a{position:relative;z-index:1;display:flex;align-items:center;gap:4px;max-width:100%;padding:1px 8px 1px 9px;border-radius:999px;color:var(--link-text);text-decoration:none}
.chips li.linked a .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips li.linked a:hover{background:var(--link);color:var(--link-ink)}
.chips li.linked a:focus-visible,.dlg-body a.tlink:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.ico{flex:none;width:11px;height:11px}
.tile-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:11px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.price{font-weight:600;font-size:14px}
.rating{font-size:13px;color:var(--muted);font-weight:400;margin-left:8px;white-space:nowrap}
.depts{grid-column:1;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.visit{grid-column:2;grid-row:1 / span 2;position:relative;z-index:1;font-size:13px;font-weight:600;text-decoration:none;color:var(--ink);border:1px solid var(--ink);border-radius:8px;padding:6px 11px;white-space:nowrap}
.visit:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Rows */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:820px}
th{text-align:left;font-weight:600;font-size:13px;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--bg)}
td.name{width:42%}
td.dept{min-width:150px}
td.nowrap{white-space:nowrap}
td.name .row-title{font-weight:600;-webkit-line-clamp:2}
td.name .desc{-webkit-line-clamp:1;margin:2px 0 6px}
td.name .chips{margin:0}
td.small{color:var(--muted);font-size:13px}
td .visit{display:inline-block}

/* Empty / notice */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:40px;text-align:center}
.empty h3{margin:0 0 6px}
.empty p{margin:0 0 14px;color:var(--muted)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--ink)}
footer.note{border-top:1px solid var(--line);padding:18px 0 32px;font-size:13px;color:var(--muted)}
footer.note button{border:0;background:none;color:var(--accent-text);cursor:pointer;padding:0;text-decoration:underline}
footer.note button + button{margin-left:12px}
footer.note button[hidden]{display:none}
.drop{position:fixed;inset:0;background:rgba(27,237,186,.18);border:3px dashed var(--accent-text);display:none;align-items:center;justify-content:center;font-size:20px;font-weight:600;z-index:50}
.drop.on{display:flex}

/* Dialog */
dialog{border:0;border-radius:14px;padding:0;width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 48px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,15,25,.5)}
.dlg-head{position:sticky;top:0;background:var(--surface);padding:22px 24px 14px;border-bottom:1px solid var(--line)}
.dlg-head h2{font-size:22px;line-height:1.25;margin:8px 40px 0 0}
.dlg-close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:none;cursor:pointer;font-size:20px;line-height:1}
.dlg-body{padding:18px 24px 24px}
.dlg-body h3{font-size:14px;margin:18px 0 6px}
.dlg-body p{margin:0}
.dlg-body ul.list{margin:0;padding-left:18px}
.dlg-body ul.list li{margin:2px 0}
.dlg-body a.tlink{color:var(--link-text);text-decoration:underline;text-underline-offset:2px;border-radius:3px}
.dlg-body a.tlink:hover{color:var(--ink)}
.dlg-body .tdom{display:inline-flex;align-items:center;gap:3px;margin-left:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.facts{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;font-size:14px;margin:16px 0 0}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.tasks-dl{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:5px 14px;font-size:14px;margin:0}
.tasks-dl dt{color:var(--muted)}
.tasks-dl dd{margin:0}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}

@media (max-width: 860px){
  .wrap{padding:0 16px}
  header.top{padding:24px 0 22px}
  header.top h1{font-size:26px}
  .band{margin-bottom:16px}
  .layout{grid-template-columns:1fr;gap:12px}
  aside.filters{display:none;position:static;max-height:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .layout.show-filters aside.filters{display:block}
  #filtersBtn{display:inline-block}
  .toolbar .count{flex-basis:100%}
  .search kbd{display:none}
  .tasks-dl{grid-template-columns:1fr;gap:0}
  .tasks-dl dd{margin:0 0 8px}
}
@media (prefers-reduced-motion: no-preference){
  dialog[open]{animation:pop .16s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}
</style>
</head>

const TOPICS_URL_RE = /topics?\s*(with|w\/)\s*(urls?|links?)/i;
const SEARCH_PARAMS = new Set(["q", "query", "search", "keyword", "keywords", "term", "terms", "s"]);
const topicKey = s => clean(s).replace(/^[\s•·*]+/, "").replace(/[\s.,;:!?]+$/, "").toLowerCase();
/* Same page as the row's Direct Link, ignoring the #fragment (text fragment / section anchor), "www.",
   letter case and a trailing slash. */
const pageKey = u => u.hostname.replace(/^www\./i, "").toLowerCase() + u.pathname.replace(/\/+$/, "").toLowerCase() + u.search;
function linkKind(u, direct){
  try{ if(direct && pageKey(u) === pageKey(new URL(direct))) return "incourse"; }catch{}
  if([...u.searchParams.keys()].some(k => SEARCH_PARAMS.has(k.toLowerCase()))) return "search";
  return /(^|\/)search(\/|$)/i.test(u.pathname) ? "search" : "course";
}
/* One line of "Topics with URLs": "• Label | https://..." (bullet optional). Split on the last " | ".
   A bad or missing URL makes it a plain topic; if what follows the pipe is a single token it is
   dropped as a broken URL, otherwise the whole line is kept as the label. */
function parseLinkedLine(line, direct){
  const s = clean(line).replace(/^[•·*]\s*/, "");
  if(!s) return null;
  const i = s.lastIndexOf(" | ");
  if(i < 0) return { label: s, url: null, kind: "plain" };
  const head = s.slice(0, i).trim(), tail = s.slice(i + 3).trim();
  try{
    const u = new URL(tail);
    if((u.protocol === "http:" || u.protocol === "https:") && head) return { label: head, url: tail, kind: linkKind(u, direct) };
  }catch{}
  if(/^\S+$/.test(tail) && head) return { label: head, url: null, kind: "plain" };
  return { label: s, url: null, kind: "plain" };
}
const parseLinkedTopics = (raw, direct) => String(raw ?? "").split(/\r?\n/).map(l => parseLinkedLine(l, direct)).filter(Boolean);
/* Topics first, in order, then labels only in "Topics with URLs"; the linked version wins on duplicates. */
function mergeTopics(plainLabels, linked){
  const plain = plainLabels.map(label => ({ label, url: null, kind: "plain" }));
  if(!linked.length) return plain;
  const map = new Map();
  for(const t of [...plain, ...linked]){
    const k = topicKey(t.label); if(!k) continue;
    const ex = map.get(k);
    if(!ex || (t.url && !ex.url)) map.set(k, t);
  }
  return [...map.values()];
}

function nameFromUrl(u){
  try{
    const parts = new URL(u).pathname.split("/").filter(Boolean);
    const slug = parts[parts.length-1] || "";
    if(!slug) return host(u);
    let t = slug.replace(/\.[a-z]+$/i,"").replace(/[-_]+/g," ").trim();
    t = t.charAt(0).toUpperCase() + t.slice(1);
    return t.replace(/\bai\b/gi,"AI").replace(/\bhr\b/gi,"HR").replace(/\bhi\b/gi,"HI").replace(/\bcx\b/gi,"CX").replace(/\bhrci\b/gi,"HRCI");
  }catch{ return u; }
}

function normDepts(raw){
  const out = new Set();
  String(raw ?? "").replace(/\([^)]*\)/g, "").split(/[;:\n,]/).map(clean).filter(Boolean).forEach(tok => {
    let hit = false;
    for(const [label, re] of DEPT_RULES){ if(re.test(tok)){ out.add(label); hit = true; } }
    if(!hit){
      if(GENERAL_RE.test(tok)) out.add(GENERAL);
      else out.add(tok.charAt(0).toUpperCase() + tok.slice(1));
    }
  });
  return [...out];
}

/* ---------- Task Area: one "Department — Task" per line ----------
   The department part is normalised with normDepts, so tasks land under the same canonical department as
   Department(s). A line with no department prefix goes under every department of the row. Tasks are keyed
   by (department, lowercased task): the same task name under two departments is two different options. */
const TASK_SEP = "\u241F";
const taskKey = (dept, task) => dept + TASK_SEP + task.toLowerCase();
const taskLabels = new Map();   // taskKey -> label as first seen in the data
function parseTasks(raw, depts){
  const out = new Map();
  String(raw ?? "").split(/\r?\n/).map(s => clean(s).replace(/^[•·*]\s*/, "")).filter(Boolean).forEach(line => {
    const m = line.match(/^(.+?)\s+([—–-])\s+(.+)$/);
    let ds = depts, task = line;
    if(m){
      const nd = normDepts(m[1]);
      // An em dash is the documented separator; with a plain hyphen or en dash, accept the prefix only if it is one of the row's departments.
      if(m[2] === "—" || nd.some(d => depts.includes(d))){ ds = nd; task = clean(m[3]); }
    }
    ds.forEach(d => { const k = taskKey(d, task); if(!out.has(k)) out.set(k, { dept: d, task, key: k }); });
  });
  return [...out.values()];
}

function normFormat(raw, isFree){
  if(isFree) return FREE_FORMAT;
  const t = clean(raw);
  for(const [label, re] of FORMAT_RULES) if(re.test(t)) return label;
  return NO_FORMAT;
}

const PRICE_RE = /[$€£]\s?([\d,]+(?:\.\d+)?)(?:\s?[–-]\s?[$€£]?\s?[\d,]+(?:\.\d+)?)?(?:\s?\/\s?[a-z]+(?:\s?\/\s?[a-z]+)?)?/i;
function parsePrice(raw, isFree){
  const items = bullets(raw);
  // lines shown in the dialog: one per bullet or per line break in the cell (clean() would join them)
  const lines = String(raw ?? "").split(/•|\r?\n/).map(clean).filter(Boolean);
  if(isFree){
    const extra = (clean(raw).match(/\(([^)]+)\)/) || [])[1];
    return { items: lines, short: extra ? `Free, ${extra}` : "Free", min: 0 };
  }
  let min = Infinity, best = "", priced = 0, hasFree = false;
  for(const it of items){
    if(/(—|-)\s*free\b/i.test(it) || /^free\b/i.test(it)) hasFree = true;
    const m = it.match(PRICE_RE);
    if(m){
      priced++;
      const v = parseFloat(m[1].replace(/,/g, ""));
      if(v < min){ min = v; best = m[0].replace(/\s?\/\s?/g, "/").replace(/\s?[–-]\s?/, "–"); }
    }
  }
  let short;
  if(hasFree){ short = priced ? `Free option, paid from ${best}` : "Free option"; min = 0; }
  else if(priced) short = (priced > 1 || /^from\b/i.test(items.join(" "))) ? `From ${best}` : best;
  else if(/by request|upon request|on request/i.test(raw)) short = "Price by request";
  else if(/not publicly listed|not listed/i.test(raw)) short = "Price not publicly listed";
  else short = "Price not publicly listed";
  return { items: lines, short, min };
}

const isEmptyish = s => !clean(s) || /^(not found|none found|n\/a|-)$/i.test(clean(s));

/* ---------- Build the model from sheets ---------- */
function buildCourses(sheets){
  const courses = [];
  sheets.forEach(sheet => {
    const rows = sheet.rows || [];
    if(!rows.length) return;
    const head = rows[0].map(h => clean(h).toLowerCase());
    const tuCol = head.findIndex(h => TOPICS_URL_RE.test(h));
    const col = re => head.findIndex((h, i) => i !== tuCol && re.test(h));
    const C = {
      name:   col(/provider|program|company|course|name/),
      link:   col(/link|url/),
      dept:   col(/department|category/),
      access: col(/access/),
      type:   col(/^type|format/),
      tasks:  col(/^tasks?\b|task area/),
      desc:   col(/description/),
      topics: col(/topic/),
      topicsUrl: tuCol,
      price:  col(/price|cost/),
      rating: col(/rating/),
    };
    const isFree = /paid/i.test(sheet.name) ? false : /free/i.test(sheet.name) ? true : C.price < 0;
    for(let r = 1; r < rows.length; r++){
      const row = rows[r];
      const get = k => C[k] >= 0 ? String(row[C[k]] ?? "") : "";
      const links = get("link").match(/https?:\/\/[^\s]+/g) || [];
      let name = clean(get("name"));
      if(!name && !links.length) continue;
      const nameless = !name;
      if(nameless) name = nameFromUrl(links[0]);
      const price = parsePrice(isFree ? get("access") : get("price"), isFree);
      const rating = isEmptyish(get("rating")) ? "" : clean(get("rating"));
      const c = {
        id: courses.length,
        name, nameless,
        source: nameless && links[0] ? host(links[0]) : "",
        links,
        cost: isFree ? "Free" : "Paid",
        depts: normDepts(get("dept")),
        tasks: [],
        format: normFormat(get("type"), isFree),
        formatRaw: clean(get("type")),
        desc: clean(get("desc")),
        topics: mergeTopics(bullets(get("topics")), parseLinkedTopics(get("topicsUrl"), links[0])),
        price, rating,
      };
      c.tasks = parseTasks(get("tasks"), c.depts);
      c.tasks.forEach(t => {
        if(!c.depts.includes(t.dept)) c.depts.push(t.dept);   // a task implies its department
        if(!taskLabels.has(t.key)) taskLabels.set(t.key, t.task);
      });
      c.taskKeys = new Set(c.tasks.map(t => t.key));
      const cells = row.map(clean);
      if(C.topicsUrl >= 0) cells[C.topicsUrl] = "";   // labels are searched via c.topics, not the raw "Label | URL" text
      c.hay = [cells.join(" "), c.topics.map(t => t.label).join(" "), c.name, c.depts.join(" "), c.format, c.cost, c.price.short].join(" ").toLowerCase();
      courses.push(c);
    }
  });
  return courses;
}

/* ---------- State ---------- */
const state = {
  all: [], terms: [],
  f: { dept: new Set(), cost: new Set(), format: new Set() },
  tasks: new Map(),        // department -> Set of taskKey; empty/missing = the whole department
  open: new Set(),         // departments whose task list is expanded
  showAll: new Set(),      // departments showing all tasks instead of the top few
  sort: "free", view: "tiles",
};
try { const v = localStorage.getItem("catalogue-view"); if(v === "rows" || v === "tiles") state.view = v; } catch {}

const FACETS = [
  { key: "dept",   title: "Department", values: c => c.depts },
  { key: "cost",   title: "Cost",       values: c => [c.cost] },
  { key: "format", title: "Format",     values: c => [c.format] },
];

function matchesQuery(c){ return state.terms.every(t => c.hay.includes(t)); }
/* Department/Task: (A && (K || L)) || (B && M) || C. A department with no ticked tasks matches as a whole. */
function matchesDept(c){
  const sel = state.f.dept;
  if(!sel.size) return true;
  for(const d of sel){
    if(!c.depts.includes(d)) continue;
    const ts = state.tasks.get(d);
    if(!ts || !ts.size) return true;
    for(const k of ts) if(c.taskKeys.has(k)) return true;
  }
  return false;
}
function matchesFacets(c, except){
  return FACETS.every(F => {
    if(F.key === except) return true;
    if(F.key === "dept") return matchesDept(c);
    const sel = state.f[F.key];
    return !sel.size || F.values(c).some(v => sel.has(v));
  });
}

/* ---------- Highlight ---------- */
function hl(text){
  const t = String(text ?? "");
  if(!state.terms.length) return esc(t);
  const re = new RegExp("(" + state.terms.map(x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "ig");
  return t.split(re).map((p, i) => i % 2 ? `<mark>${esc(p)}</mark>` : esc(p)).join("");
}
function orderedTopics(c){
  if(!state.terms.length) return c.topics;
  const hit = t => state.terms.some(x => t.label.toLowerCase().includes(x));
  return [...c.topics.filter(hit), ...c.topics.filter(t => !hit(t))];
}
function chipHTML(t){
  if(!t.url) return `<li title="${esc(t.label)}">${hl(t.label)}</li>`;
  const dom = host(t.url);
  const what = t.kind === "search" ? `search on ${dom}` : t.kind === "incourse" ? `in this course, ${dom}` : dom;
  const tip = t.kind === "incourse" ? `In this course · ${dom}` : dom;
  return `<li class="linked${t.kind === "incourse" ? " incourse" : ""}"><a href="${esc(t.url)}" target="_blank" rel="noopener" title="${esc(tip)}" aria-label="${esc(`${t.label} (${what}, opens in a new tab)`)}"><span class="lbl">${hl(t.label)}</span>${ICO[t.kind] || ICO.course}</a></li>`;
}
function chips(c, n){
  const t = orderedTopics(c);
  if(!t.length) return "";
  const more = t.length - n;
  return `<ul class="chips">${t.slice(0, n).map(chipHTML).join("")}${more > 0 ? `<li class="more">+${more} more</li>` : ""}</ul>`;
}
const badge = c => `<span class="badge ${c.cost.toLowerCase()}">${c.cost}</span>`;
const ratingShort = r => r ? "★ " + esc(r.split("(")[0].trim()) : "";
const visit = c => c.links[0] ? `<a class="visit" href="${esc(c.links[0])}" target="_blank" rel="noopener">Visit site</a>` : "";

/* ---------- Render ---------- */
const TASKS_SHOWN = 6;
const CHEVRON = '<svg viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M4.5 2.5 8 6l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function taskListHTML(d, i, pool){
  const totals = new Map(), all = new Map();
  state.all.forEach(c => c.tasks.forEach(t => { if(t.dept === d){ all.set(t.key, (all.get(t.key) || 0) + 1); totals.set(t.key, 0); } }));
  pool.forEach(c => c.tasks.forEach(t => { if(t.dept === d) totals.set(t.key, totals.get(t.key) + 1); }));
  const keys = [...all.keys()].sort((a, b) => all.get(b) - all.get(a) || taskLabels.get(a).localeCompare(taskLabels.get(b)));
  const sel = state.tasks.get(d) || new Set();
  const full = state.showAll.has(d) || keys.length <= TASKS_SHOWN + 1;
  const shown = full ? keys : keys.filter((k, n) => n < TASKS_SHOWN || sel.has(k));
  const max = Math.max(1, ...keys.map(k => totals.get(k)));
  return `<div class="tasks" id="tasks-${i}" role="group" aria-label="${esc(d)} tasks">
    ${shown.map(k => {
      const n = totals.get(k), fk = `task:${k}`;
      return `<label class="opt sub${n ? "" : " zero"}" style="--w:${Math.round(n / max * 100)}%">
        <input type="checkbox" data-facet="task" data-dept="${esc(d)}" value="${esc(k)}" data-fk="${esc(fk)}" ${sel.has(k) ? "checked" : ""}>
        <span>${esc(taskLabels.get(k))}</span><em>${n}</em></label>`;
    }).join("")}
    ${keys.length > TASKS_SHOWN + 1 ? `<button type="button" class="more-tasks" data-more-tasks="${esc(d)}" data-fk="${esc("more:" + d)}">${state.showAll.has(d) ? "Show fewer" : `Show all ${keys.length} tasks`}</button>` : ""}
  </div>`;
}
function deptFacetHTML(F, pool, totals, values, max){
  const sel = state.f.dept;
  return values.map((v, i) => {
    const n = totals.get(v), w = Math.round(n / max * 100);
    const hasTasks = state.all.some(c => c.tasks.some(t => t.dept === v));
    const open = hasTasks && state.open.has(v);
    const nSel = (state.tasks.get(v) || new Set()).size;
    return `<div class="dept-row">
      <label class="opt${n ? "" : " zero"}" style="--w:${w}%">
        <input type="checkbox" data-facet="dept" value="${esc(v)}" data-fk="${esc("dept:" + v)}" ${sel.has(v) ? "checked" : ""}>
        <span>${esc(v)}</span><em>${n}</em></label>
      ${hasTasks ? `<button type="button" class="disc" data-toggle-tasks="${esc(v)}" data-fk="${esc("disc:" + v)}" aria-expanded="${open}" aria-controls="tasks-${i}"
        aria-label="${open ? "Hide" : "Show"} ${esc(v)} tasks${nSel ? `, ${nSel} selected` : ""}" title="${open ? "Hide" : "Show"} tasks">${nSel && !open ? `<span class="sel">${nSel}</span>` : CHEVRON}</button>` : ""}
    </div>
    ${open ? taskListHTML(v, i, pool) : ""}`;
  }).join("");
}
function renderFacets(){
  const html = FACETS.map(F => {
    const pool = state.all.filter(c => matchesQuery(c) && matchesFacets(c, F.key));
    const totals = new Map();
    state.all.forEach(c => F.values(c).forEach(v => totals.set(v, 0)));
    pool.forEach(c => F.values(c).forEach(v => totals.set(v, (totals.get(v) || 0) + 1)));
    let values = [...totals.keys()];
    if(F.key === "cost") values.sort();
    else {
      const all = new Map();
      state.all.forEach(c => F.values(c).forEach(v => all.set(v, (all.get(v) || 0) + 1)));
      values.sort((a, b) => (a === NO_FORMAT) - (b === NO_FORMAT) || all.get(b) - all.get(a) || a.localeCompare(b));
    }
    const max = Math.max(1, ...values.map(v => totals.get(v)));
    const sel = state.f[F.key];
    return `<section class="facet">
      <h2>${F.title}${sel.size ? `<button type="button" data-clear="${F.key}">Clear</button>` : ""}</h2>
      ${F.key === "dept" ? deptFacetHTML(F, pool, totals, values, max) : values.map(v => {
        const n = totals.get(v), w = Math.round(n / max * 100);
        return `<label class="opt${n ? "" : " zero"}" style="--w:${w}%">
          <input type="checkbox" data-facet="${F.key}" value="${esc(v)}" data-fk="${esc(F.key + ":" + v)}" ${sel.has(v) ? "checked" : ""}>
          <span>${esc(v)}</span><em>${n}</em></label>`;
      }).join("")}
      ${F.key === "dept" ? `<p class="facet-note">Bars show how many courses match your current search and filters. Open a department to narrow it down by task.</p>` : ""}
    </section>`;
  }).join("");
  const box = $("#filters"), scroll = box.scrollTop;
  const fk = box.contains(document.activeElement) ? document.activeElement.dataset.fk : null;   // keep keyboard focus across re-renders
  box.innerHTML = html;
  box.scrollTop = scroll;
  if(fk){ const el = box.querySelector(`[data-fk="${CSS.escape(fk)}"]`); if(el) el.focus({ preventScroll: true }); }
}

function renderActive(){
  const parts = [];
  const pill = (facet, value, text) => `<button type="button" data-remove="${facet}" data-value="${esc(value)}" aria-label="Remove filter ${esc(text)}">${esc(text)}</button>`;
  FACETS.forEach(F => state.f[F.key].forEach(v => {
    const ts = F.key === "dept" ? state.tasks.get(v) : null;
    if(ts && ts.size) ts.forEach(k => parts.push(pill("task", k, `${v} › ${taskLabels.get(k)}`)));
    else parts.push(pill(F.key, v, v));
  }));
  const nFilters = parts.length;
  if(parts.length > 1) parts.push(`<button type="button" class="clear" data-clearall>Clear all</button>`);
  $("#active").innerHTML = parts.join("");
  const n = nFilters;
  $("#filtersBtn").textContent = n ? `Filters (${n})` : "Filters";
}

function sorted(list){
  const byName = (a, b) => a.name.localeCompare(b.name);
  const s = [...list];
  if(state.sort === "name") s.sort(byName);
  else if(state.sort === "price-asc") s.sort((a, b) => a.price.min - b.price.min || byName(a, b));
  else if(state.sort === "price-desc") s.sort((a, b) => {
    const pa = isFinite(a.price.min) ? a.price.min : -1, pb = isFinite(b.price.min) ? b.price.min : -1;
    return pb - pa || byName(a, b);
  });
  else s.sort((a, b) => (a.cost === "Paid") - (b.cost === "Paid") || (a.nameless - b.nameless) || byName(a, b));
  return s;
}

/* Tasks on tiles: tasks matching the task filter first, then tasks of ticked departments, then search hits,
   then the rest. The same task name under several departments is shown once (title lists the departments). */
function taskTags(c, n){
  if(!c.tasks.length) return "";
  const rank = t => {
    const ts = state.tasks.get(t.dept);
    if(ts && ts.has(t.key)) return 0;
    if(state.f.dept.has(t.dept) && !(ts && ts.size)) return 1;
    if(state.terms.some(x => t.task.toLowerCase().includes(x))) return 2;
    return 3;
  };
  const byName = new Map();
  c.tasks.forEach((t, i) => {
    const k = t.task.toLowerCase(), r = rank(t), ex = byName.get(k);
    if(!ex) byName.set(k, { task: t.task, r, i, depts: [t.dept] });
    else { ex.depts.push(t.dept); if(r < ex.r) ex.r = r; }
  });
  const list = [...byName.values()].sort((a, b) => a.r - b.r || a.i - b.i);
  const more = list.length - n;
  return `<ul class="ttags" aria-label="Tasks">${list.slice(0, n).map(t =>
    `<li class="${t.r < 2 ? "hit" : ""}" title="${esc(t.depts.map(d => `${d} › ${t.task}`).join("\n"))}">${hl(t.task)}</li>`).join("")}${more > 0 ? `<li class="more">+${more} more</li>` : ""}</ul>`;
}
/* Tasks (squares) and topics (pills) are two groups: when a tile has both, each gets a small caption and a divider. */
function tagGroups(c){
  const tasks = taskTags(c, 3), topics = chips(c, c.desc || c.tasks.length ? 4 : 6);
  if(tasks && topics) return `<div class="tgroup"><p class="cap" aria-hidden="true">Tasks</p>${tasks}</div><div class="tgroup"><p class="cap" aria-hidden="true">Topics</p>${topics}</div>`;
  return tasks + topics;
}
function tileHTML(c){
  return `<article class="tile">
    <div class="tile-top">${badge(c)}<span>${esc(c.format)}</span></div>
    <h3><button type="button" data-open="${c.id}">${hl(c.name)}</button></h3>
    ${c.source ? `<p class="src">${esc(c.source)}</p>` : ""}
    ${c.desc ? `<p class="desc">${hl(c.desc)}</p>` : ""}
    ${tagGroups(c)}
    <div class="tile-foot">
      <div class="price">${esc(c.price.short)}${c.rating ? `<span class="rating">${ratingShort(c.rating)}</span>` : ""}</div>
      <div class="depts" title="${esc(c.depts.join(", "))}">${esc(c.depts.join(", ") || "Department not set")}</div>
      ${visit(c)}
    </div>
  </article>`;
}

function rowHTML(c){
  return `<tr data-open="${c.id}" tabindex="0">
    <td class="name"><span class="row-title">${hl(c.name)}</span>
      ${c.source ? `<div class="src">${esc(c.source)}</div>` : ""}
      ${c.desc ? `<p class="desc">${hl(c.desc)}</p>` : ""}
      ${chips(c, 3)}</td>
    <td class="small dept">${esc(c.depts.join(", "))}</td>
    <td>${badge(c)}</td>
    <td class="small nowrap">${esc(c.format)}</td>
    <td>${esc(c.price.short)}</td>
    <td class="small nowrap">${ratingShort(c.rating)}</td>
  </tr>`;
}

function render(){
  const list = sorted(state.all.filter(c => matchesQuery(c) && matchesFacets(c)));
  renderFacets(); renderActive();
  $("#count").textContent = `${list.length} of ${state.all.length} ${state.all.length === 1 ? "resource" : "resources"}`;
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === state.view)));
  const out = $("#results");
  if(!list.length){
    out.innerHTML = `<div class="empty"><h3>No courses match</h3><p>Try a shorter search or remove some filters.</p><button class="btn" type="button" data-clearall>Clear search and filters</button></div>`;
    return;
  }
  out.innerHTML = state.view === "tiles"
    ? `<div class="tiles">${list.map(tileHTML).join("")}</div>`
    : `<div class="table-wrap"><table><thead><tr><th>Course</th><th>Department</th><th>Cost</th><th>Format</th><th>Price</th><th>Rating</th></tr></thead><tbody>${list.map(rowHTML).join("")}</tbody></table></div>`;
}

/* ---------- Detail dialog ---------- */
function topicItemHTML(t){
  if(!t.url) return `<li>${esc(t.label)}</li>`;
  const dom = host(t.url);
  const what = t.kind === "search" ? `Search on ${esc(dom)}`
    : t.kind === "incourse" ? `${t.url.includes("#") ? "Section of this course" : "This course"} · ${esc(dom)}` : esc(dom);
  return `<li><a class="tlink" href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.label)}</a><span class="tdom">${ICO[t.kind] || ICO.course}${what}</span></li>`;
}
function tasksHTML(c){
  if(!c.tasks.length) return "";
  const by = new Map(c.depts.map(d => [d, []]));
  c.tasks.forEach(t => by.get(t.dept).push(t.task));
  return `<h3>Tasks</h3><dl class="tasks-dl">${[...by].filter(([, ts]) => ts.length).map(([d, ts]) => `<dt>${esc(d)}</dt><dd>${ts.map(esc).join(", ")}</dd>`).join("")}</dl>`;
}
function openDetail(id){
  const c = state.all[id]; if(!c) return;
  const dlg = $("#detail");
  dlg.innerHTML = `
    <div class="dlg-head">
      <div class="tile-top" style="margin:0">${badge(c)}<span>${esc(c.format)}${c.formatRaw && c.formatRaw !== c.format ? ` (${esc(c.formatRaw)})` : ""}</span></div>
      <h2 id="dlgTitle">${esc(c.name)}</h2>
      ${c.nameless ? `<p class="src">Name not listed in the catalogue. Source: ${esc(c.source)}</p>` : ""}
      <button class="dlg-close" type="button" data-close aria-label="Close">×</button>
    </div>
    <div class="dlg-body">
      ${c.desc ? `<p>${esc(c.desc)}</p>` : ""}
      <dl class="facts">
        <dt>Department</dt><dd>${esc(c.depts.join(", ") || "Not set")}</dd>
        <dt>Price</dt><dd>${esc(c.price.short)}</dd>
        ${c.rating ? `<dt>Rating</dt><dd>${esc(c.rating)}</dd>` : ""}
      </dl>
      ${tasksHTML(c)}
      ${c.topics.length ? `<h3>Topics</h3><ul class="list">${c.topics.map(topicItemHTML).join("")}</ul>` : ""}
      ${c.price.items.length && c.cost === "Paid" ? `<h3>Pricing</h3><ul class="list">${c.price.items.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}
      <div class="links">${c.links.map((u, i) => `<a class="btn${i ? " ghost" : ""}" href="${esc(u)}" target="_blank" rel="noopener">${c.links.length > 1 ? "Open " + esc(host(u)) : "Visit site"}</a>`).join("") || `<p class="src">No link in the catalogue.</p>`}</div>
    </div>`;
  dlg.showModal();
}

/* ---------- Events ---------- */
$("#q").addEventListener("input", e => {
  state.terms = clean(e.target.value).toLowerCase().split(" ").filter(Boolean);
  render();
});
document.addEventListener("keydown", e => {
  if(e.key === "/" && !/input|textarea|select/i.test(document.activeElement.tagName) && !$("#detail").open){ e.preventDefault(); $("#q").focus(); }
});
$("#sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
document.querySelector(".seg").addEventListener("click", e => {
  const b = e.target.closest("button[data-view]"); if(!b) return;
  state.view = b.dataset.view;
  try { localStorage.setItem("catalogue-view", state.view); } catch {}
  render();
});
$("#filtersBtn").addEventListener("click", () => {
  const on = $("#layout").classList.toggle("show-filters");
  $("#filtersBtn").setAttribute("aria-expanded", String(on));
});
$("#filters").addEventListener("change", e => {
  const i = e.target.closest("input[data-facet]"); if(!i) return;
  if(i.dataset.facet === "task"){
    const d = i.dataset.dept;
    if(!state.tasks.has(d)) state.tasks.set(d, new Set());
    if(i.checked){ state.tasks.get(d).add(i.value); state.f.dept.add(d); }   // ticking a task ticks its department
    else state.tasks.get(d).delete(i.value);                                // last task off -> whole department stays ticked
    return render();
  }
  const set = state.f[i.dataset.facet];
  i.checked ? set.add(i.value) : set.delete(i.value);
  if(i.dataset.facet === "dept"){
    if(i.checked) state.open.add(i.value);
    else { state.tasks.delete(i.value); state.open.delete(i.value); }
  }
  render();
});
function clearAll(){
  FACETS.forEach(F => state.f[F.key].clear());
  state.tasks.clear();
  state.terms = []; $("#q").value = "";
  render();
}
document.addEventListener("click", e => {
  const t = e.target;
  if(t.closest("[data-clearall]")) return clearAll();
  const cl = t.closest("[data-clear]"); if(cl){ state.f[cl.dataset.clear].clear(); if(cl.dataset.clear === "dept") state.tasks.clear(); return render(); }
  const rm = t.closest("[data-remove]");
  if(rm){
    if(rm.dataset.remove === "task") state.tasks.get(rm.dataset.value.split(TASK_SEP)[0])?.delete(rm.dataset.value);
    else { state.f[rm.dataset.remove].delete(rm.dataset.value); if(rm.dataset.remove === "dept") state.tasks.delete(rm.dataset.value); }
    return render();
  }
  const tg = t.closest("[data-toggle-tasks]");
  if(tg){ const d = tg.dataset.toggleTasks; state.open.has(d) ? state.open.delete(d) : state.open.add(d); return renderFacets(); }
  const mt = t.closest("[data-more-tasks]");
  if(mt){ const d = mt.dataset.moreTasks; state.showAll.has(d) ? state.showAll.delete(d) : state.showAll.add(d); return renderFacets(); }
  if(t.closest("[data-close]")) return $("#detail").close();
  if(t.closest("a")) return;
  const op = t.closest("[data-open]"); if(op) openDetail(+op.dataset.open);
});
$("#results").addEventListener("keydown", e => {
  if(e.target.closest("a")) return;   // let Enter/Space on a topic link follow the link, not open the dialog
  const tr = e.target.closest("tr[data-open]");
  if(tr && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); openDetail(+tr.dataset.open); }
});
$("#detail").addEventListener("click", e => { if(e.target === e.currentTarget) e.currentTarget.close(); });

/* ---------- Loading data ---------- */
function setData(sheets, note){
  state.all = buildCourses(sheets);
  $("#source").textContent = note + " ";
  render();
}
function loadLib(){
  if(window.XLSX) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = XLSX_CDN; s.onload = res; s.onerror = () => rej(new Error("Excel reader could not load"));
    document.head.appendChild(s);
  });
}
function sheetsFromBuffer(buf){
  const wb = XLSX.read(buf, { type: "array", cellFormula: true });
  return wb.SheetNames.map(n => {
    const ws = wb.Sheets[n];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: false, blankrows: false });
    const range = XLSX.utils.decode_range(ws["!ref"] || "A1:A1");
    for(let r = range.s.r; r <= range.e.r; r++){
      for(let c = range.s.c; c <= range.e.c; c++){
        const cell = ws[XLSX.utils.encode_cell({r,c})];
        if(!cell || !cell.f || !/^HYPERLINK\(/i.test(cell.f)) continue;
        const m = cell.f.match(/^HYPERLINK\(\s*"([^"]+)"/i);
        if(m){
          while(rows.length <= r) rows.push([]);
          while(rows[r].length <= c) rows[r].push("");
          rows[r][c] = m[1];
        }
      }
    }
    return { name: n, rows };
  });
}
let loaded = null;   // last Excel file loaded by hand
async function loadFile(file){
  try{
    await loadLib();
    const sheets = sheetsFromBuffer(await file.arrayBuffer());
    setData(sheets, `Showing ${file.name}, loaded from your computer. Other people still see the built-in copy until you save the page with this data and replace index.html.`);
    loaded = { sheets, name: file.name };
    $("#saveBtn").hidden = false;
  }catch(err){
    $("#source").textContent = `Couldn't read ${file.name}: ${err.message}. Check that it's an .xlsx file. `;
  }
}
$("#loadBtn").addEventListener("click", () => $("#file").click());
$("#saveBtn").addEventListener("click", () => {
  if(!loaded) return;
  const d = new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
  const json = JSON.stringify({ date: `${d}, ${loaded.name}`, sheets: loaded.sheets })
    .replace(/<\//g, "<\\/").replace(/\u2028/g, "\\u2028").replace(/\u2029/g, "\\u2029");
  const A = "/*EMBEDDED-" + "START*/", B = "/*EMBEDDED-" + "END*/";
  const a = PAGE_SRC.indexOf(A), b = PAGE_SRC.indexOf(B, a);
  if(a < 0 || b < 0){ $("#source").textContent = "Couldn't build the updated page: data markers not found. "; return; }
  const html = PAGE_SRC.slice(0, a + A.length) + json + PAGE_SRC.slice(b);
  const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
  const link = Object.assign(document.createElement("a"), { href: url, download: "index.html" });
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  $("#source").textContent = `Saved a new index.html with ${loaded.name} built in. Replace the old index.html with it (check your Downloads folder). `;
});
$("#file").addEventListener("change", e => { if(e.target.files[0]) loadFile(e.target.files[0]); e.target.value = ""; });
let dragDepth = 0;
window.addEventListener("dragenter", e => { if([...e.dataTransfer.types].includes("Files")){ dragDepth++; $("#drop").classList.add("on"); } });
window.addEventListener("dragleave", () => { if(--dragDepth <= 0){ dragDepth = 0; $("#drop").classList.remove("on"); } });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => {
  e.preventDefault(); dragDepth = 0; $("#drop").classList.remove("on");
  const f = e.dataTransfer.files[0]; if(f) loadFile(f);
});

(async function init(){
  try{
    if(!/^https?:$/.test(location.protocol)) throw new Error("not served");
    const r = await fetch(`${DATA_FILE}?v=${Date.now()}`, { cache: "no-store" });
    if(!r.ok) throw new Error("missing");
    const buf = await r.arrayBuffer();
    await loadLib();
    setData(sheetsFromBuffer(buf), `Live data from ${DATA_FILE}.`);
  }catch{
    if(EMBEDDED) setData(EMBEDDED.sheets, `Showing the built-in copy of the catalogue (${EMBEDDED.date}). When this page is opened as a file, the browser can't read courses.xlsx from the folder. To update: load the new Excel file below, then save the page with this data.`);
    else setData([], `${DATA_FILE} wasn't found next to this page.`);
  }
})();
})();
</script>
